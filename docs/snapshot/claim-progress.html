<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Machinen claim progress</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f172a;
        --card: #111827;
        --card-2: #0b1220;
        --muted: #94a3b8;
        --text: #e5e7eb;
        --line: #334155;
        --good: #22c55e;
        --warn: #f59e0b;
        --info: #38bdf8;
        --bad: #ef4444;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      main {
        max-width: 1480px;
        margin: 0 auto;
        padding: 32px 20px 56px;
      }
      header {
        display: grid;
        gap: 12px;
        margin-bottom: 24px;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: clamp(28px, 5vw, 46px);
        line-height: 1;
      }
      h2 {
        font-size: 22px;
      }
      h3 {
        font-size: 16px;
      }
      .muted {
        color: var(--muted);
      }
      .grid {
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        margin: 22px 0;
      }
      .metric,
      .card,
      details.track-group {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 18px;
      }
      .metric strong {
        display: block;
        font-size: 30px;
        margin-top: 6px;
      }
      .card {
        margin-top: 18px;
        overflow-x: auto;
      }
      .groups {
        display: grid;
        gap: 18px;
        margin-top: 18px;
      }
      details.track-group {
        padding: 0;
        overflow: hidden;
      }
      details.track-group summary {
        align-items: center;
        cursor: pointer;
        display: grid;
        gap: 12px;
        grid-template-columns: minmax(240px, 1fr) auto auto auto;
        list-style: none;
        padding: 18px;
      }
      details.track-group summary::-webkit-details-marker {
        display: none;
      }
      .track-body {
        border-top: 1px solid var(--line);
        display: grid;
        gap: 16px;
        padding: 18px;
      }
      .claim-strip {
        display: grid;
        gap: 10px;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      }
      .claim-box {
        background: var(--card-2);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 12px;
      }
      .claim-box strong {
        display: block;
        font-size: 22px;
        margin-top: 4px;
      }
      .subtables {
        display: grid;
        gap: 18px;
      }
      table {
        border-collapse: collapse;
        margin-top: 14px;
        min-width: 100%;
        width: max-content;
      }
      .track-body table {
        width: 100%;
      }
      th,
      td {
        border-bottom: 1px solid var(--line);
        max-width: 420px;
        padding: 10px 12px;
        text-align: left;
        vertical-align: top;
      }
      th {
        color: var(--muted);
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      tbody tr:hover {
        background: color-mix(in srgb, var(--info) 7%, transparent);
      }
      .pill {
        border-radius: 999px;
        display: inline-block;
        font-size: 12px;
        font-weight: 800;
        padding: 4px 9px;
        white-space: nowrap;
      }
      .claimed,
      .passed,
      .implemented-product-support,
      .true {
        background: color-mix(in srgb, var(--good) 24%, transparent);
        color: #86efac;
      }
      .seed-candidate,
      .verified-seed,
      .product-track-existing,
      .refused {
        background: color-mix(in srgb, var(--warn) 24%, transparent);
        color: #fcd34d;
      }
      .not-started,
      .not-proven,
      .forbidden,
      .false {
        background: color-mix(in srgb, var(--bad) 24%, transparent);
        color: #fca5a5;
      }
      ul {
        margin: 8px 0 0;
        padding-left: 18px;
      }
      code {
        color: #bae6fd;
      }
      .error {
        color: #fecaca;
      }
      .section-heading {
        align-items: baseline;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: space-between;
      }
      .track-title {
        display: grid;
        gap: 4px;
      }
      .compact {
        white-space: nowrap;
      }
      @media (max-width: 860px) {
        details.track-group summary {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p class="muted">Machinen product evidence</p>
        <h1>Claim progress dashboard</h1>
        <p class="muted">
          Grouped by product track. The page embeds a snapshot for direct file viewing; when served
          over HTTP, reloading the page reads the latest <code>claim-progress.json</code>.
        </p>
        <p id="source" class="muted"></p>
      </header>

      <section id="metrics" class="grid" aria-label="summary metrics"></section>

      <section class="card">
        <div class="section-heading">
          <h2>Claim matrix</h2>
          <span class="muted">One row per track</span>
        </div>
        <div id="claim-matrix"></div>
      </section>

      <section class="groups" id="track-groups" aria-label="grouped track details"></section>

      <p id="error" class="error" role="alert"></p>
    </main>

    <script>
      const jsonPath = "./claim-progress.json";
      const metrics = document.querySelector("#metrics");
      const source = document.querySelector("#source");
      const error = document.querySelector("#error");
      const claimMatrix = document.querySelector("#claim-matrix");
      const trackGroups = document.querySelector("#track-groups");

      loadEmbedded();
      if (globalThis.location?.protocol !== "file:") void loadRemote();

      function loadEmbedded() {
        const embedded = document.querySelector("#embedded-claim-progress")?.textContent;
        if (!embedded) return;
        render(JSON.parse(embedded), "embedded claim-progress snapshot");
      }

      async function loadRemote() {
        error.textContent = "";
        try {
          const response = await fetch(`${jsonPath}?t=${Date.now()}`);
          if (!response.ok) throw new Error(`failed to load ${jsonPath}: ${response.status}`);
          render(await response.json(), jsonPath);
        } catch (loadError) {
          error.textContent = `${loadError.message}. Showing the embedded snapshot instead.`;
          loadEmbedded();
        }
      }

      function render(data, label) {
        source.textContent = `source: ${label} · version: ${data.version ?? "unknown"}`;
        const tracks = data.tracks ?? [];
        metrics.innerHTML = metricCards(data, tracks).join("");
        claimMatrix.innerHTML = table(
          [
            "Track",
            "Status",
            "Product",
            "Broad",
            "Arbitrary process",
            "Gate",
            "Evidence",
            "Refusals",
            "Next",
          ],
          tracks.map((track) => [
            `<strong>${escapeHtml(track.name)}</strong><p class="muted">${escapeHtml(track.family)} · ${escapeHtml(track.runtime)} · ${escapeHtml(track.stage)}</p>`,
            pill(track.status),
            claimValue(track.currentClaim?.productSupport),
            claimValue(track.currentClaim?.broadSupport),
            claimValue(track.currentClaim?.arbitraryProcessCrossArchRestore),
            track.claimGate,
            count(track.evidenceRows, "row"),
            count(track.refusalRows, "boundary"),
            count(track.nextSteps, "step"),
          ]),
        );
        trackGroups.innerHTML = tracks.map(trackGroup).join("");
      }

      function trackGroup(track, index) {
        return `<details class="track-group" ${index === 0 ? "open" : ""}>
          <summary>
            <span class="track-title"><strong>${escapeHtml(track.name)}</strong><span class="muted">${escapeHtml(track.scope ?? "")}</span></span>
            ${pill(track.status)}
            <span class="compact">claim: ${claimValue(track.currentClaim?.productSupport)} / ${claimValue(track.currentClaim?.broadSupport)} / ${claimValue(track.currentClaim?.arbitraryProcessCrossArchRestore)}</span>
            <span class="compact">change: ${pill(String(track.claimChangeAllowed))}</span>
          </summary>
          <div class="track-body">
            <div class="claim-strip">
              ${claimBox("Family", `${track.family} / ${track.runtime}`)}
              ${claimBox("Product path", track.productPath ?? "—")}
              ${claimBox("Claim gate", track.claimGate ?? "—")}
              ${claimBox("Next claim", claimObject(track.nextClaim))}
            </div>
            <p>${escapeHtml(track.summary ?? "")}</p>
            <div class="subtables">
              <section>
                <h3>Evidence rows</h3>
                ${table(
                  ["Row", "Area", "Kind", "Status", "Evidence", "Gate", "Artifact", "Next"],
                  (track.evidenceRows ?? []).map((row) => [
                    row.id,
                    row.area,
                    row.kind,
                    pill(row.status),
                    row.evidence,
                    row.gate,
                    code(row.artifact),
                    row.next,
                  ]),
                )}
              </section>
              <section>
                <h3>Refusal boundaries</h3>
                ${table(
                  ["Boundary", "Status", "Reason", "Needed to reduce"],
                  (track.refusalRows ?? []).map((row) => [
                    row.boundary,
                    pill(row.status),
                    row.reason,
                    row.neededToReduce,
                  ]),
                )}
              </section>
              <section>
                <h3>Next steps</h3>
                ${table(
                  ["Priority", "Item", "Gate"],
                  (track.nextSteps ?? []).map((row) => [row.priority, row.item, row.gate]),
                )}
              </section>
            </div>
          </div>
        </details>`;
      }

      function metricCards(data, tracks) {
        const evidenceRows = tracks.reduce(
          (sum, track) => sum + (track.evidenceRows?.length ?? 0),
          0,
        );
        const refusalRows = tracks.reduce(
          (sum, track) => sum + (track.refusalRows?.length ?? 0),
          0,
        );
        const blockedClaims = tracks.filter((track) => track.claimChangeAllowed === false).length;
        return [
          metric("Tracks", tracks.length),
          metric("Evidence rows", evidenceRows),
          metric("Refusal rows", refusalRows),
          metric("Blocked claim changes", blockedClaims),
          metric("Product path", data.currentProductPath ?? "—"),
        ];
      }

      function metric(label, value) {
        return `<article class="metric"><span class="muted">${escapeHtml(label)}</span><strong>${escapeHtml(String(value))}</strong></article>`;
      }

      function claimBox(label, value) {
        return `<article class="claim-box"><span class="muted">${escapeHtml(label)}</span><strong>${formatCell(value)}</strong></article>`;
      }

      function table(headers, rows) {
        if (rows.length === 0) return `<p class="muted">No rows yet.</p>`;
        return `<table><thead><tr>${headers.map((header) => `<th>${escapeHtml(header)}</th>`).join("")}</tr></thead><tbody>${rows
          .map((row) => `<tr>${row.map((cell) => `<td>${formatCell(cell)}</td>`).join("")}</tr>`)
          .join("")}</tbody></table>`;
      }

      function formatCell(value) {
        if (value === null || value === undefined || value === "") return "—";
        if (typeof value === "string" && value.includes("<")) return value;
        return escapeHtml(String(value));
      }

      function claimObject(claim) {
        if (!claim) return "—";
        return Object.entries(claim)
          .map(([key, value]) => `${key}: ${value}`)
          .join(" · ");
      }

      function claimValue(value) {
        if (value === null || value === undefined) return "—";
        return typeof value === "number" ? `${value}%` : String(value);
      }

      function count(items = [], unit) {
        return `${items.length} ${unit}${items.length === 1 ? "" : "s"}`;
      }

      function pill(value) {
        return `<span class="pill ${escapeHtml(String(value))}">${escapeHtml(String(value))}</span>`;
      }

      function code(value) {
        return `<code>${escapeHtml(String(value))}</code>`;
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }
    </script>
  </body>
</html>
