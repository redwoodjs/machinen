<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Machinen claim progress</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f172a;
        --card: #111827;
        --muted: #94a3b8;
        --text: #e5e7eb;
        --line: #334155;
        --good: #22c55e;
        --warn: #f59e0b;
        --info: #38bdf8;
        --bad: #ef4444;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      main {
        max-width: 1180px;
        margin: 0 auto;
        padding: 32px 20px 56px;
      }
      header {
        display: grid;
        gap: 12px;
        margin-bottom: 24px;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: clamp(28px, 5vw, 46px);
        line-height: 1;
      }
      .muted {
        color: var(--muted);
      }
      .toolbar {
        align-items: center;
        border: 1px solid var(--line);
        border-radius: 16px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        padding: 14px;
      }
      button,
      label.file {
        background: #1f2937;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--text);
        cursor: pointer;
        font-weight: 700;
        padding: 9px 14px;
      }
      input[type="file"] {
        display: none;
      }
      .grid {
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        margin: 22px 0;
      }
      .metric,
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 18px;
      }
      .metric strong {
        display: block;
        font-size: 30px;
        margin-top: 6px;
      }
      table {
        border-collapse: collapse;
        margin-top: 18px;
        overflow: hidden;
        width: 100%;
      }
      th,
      td {
        border-bottom: 1px solid var(--line);
        padding: 12px;
        text-align: left;
        vertical-align: top;
      }
      th {
        color: var(--muted);
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .pill {
        border-radius: 999px;
        display: inline-block;
        font-size: 12px;
        font-weight: 800;
        padding: 4px 9px;
        white-space: nowrap;
      }
      .claimed {
        background: color-mix(in srgb, var(--good) 24%, transparent);
        color: #86efac;
      }
      .seed-candidate,
      .product-track-existing {
        background: color-mix(in srgb, var(--warn) 24%, transparent);
        color: #fcd34d;
      }
      .not-started {
        background: color-mix(in srgb, var(--bad) 24%, transparent);
        color: #fca5a5;
      }
      ul {
        margin: 8px 0 0;
        padding-left: 18px;
      }
      code {
        color: #bae6fd;
      }
      .error {
        color: #fecaca;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p class="muted">Machinen product evidence</p>
        <h1>Claim progress dashboard</h1>
        <p class="muted">
          Reads <code>claim-progress.json</code>. Refresh this page after the JSON changes, or load
          a local JSON file.
        </p>
      </header>

      <section class="toolbar">
        <button id="refresh" type="button">Refresh JSON</button>
        <label class="file"
          >Load JSON file<input id="file" type="file" accept="application/json,.json"
        /></label>
        <span id="source" class="muted"></span>
      </section>

      <section id="metrics" class="grid" aria-label="summary metrics"></section>
      <section class="card">
        <h2>Tracks</h2>
        <div id="table"></div>
      </section>
      <p id="error" class="error" role="alert"></p>
    </main>

    <script>
      const jsonPath = "./claim-progress.json";
      const metrics = document.querySelector("#metrics");
      const table = document.querySelector("#table");
      const source = document.querySelector("#source");
      const error = document.querySelector("#error");

      document.querySelector("#refresh").addEventListener("click", () => loadRemote());
      document.querySelector("#file").addEventListener("change", async (event) => {
        const file = event.target.files?.[0];
        if (!file) return;
        render(JSON.parse(await file.text()), `loaded file: ${file.name}`);
      });

      loadRemote();

      async function loadRemote() {
        error.textContent = "";
        try {
          const response = await fetch(`${jsonPath}?t=${Date.now()}`);
          if (!response.ok) throw new Error(`failed to load ${jsonPath}: ${response.status}`);
          render(await response.json(), jsonPath);
        } catch (loadError) {
          error.textContent = `${loadError.message}. If opened from file://, use “Load JSON file”.`;
        }
      }

      function render(data, label) {
        source.textContent = label;
        const tracks = data.tracks ?? [];
        metrics.innerHTML = metricCards(data, tracks).join("");
        table.innerHTML = `
          <table>
            <thead>
              <tr>
                <th>Track</th>
                <th>Status</th>
                <th>Current claim</th>
                <th>Next claim</th>
                <th>Evidence</th>
                <th>Refusals / boundaries</th>
              </tr>
            </thead>
            <tbody>${tracks.map(trackRow).join("")}</tbody>
          </table>`;
      }

      function metricCards(data, tracks) {
        const claimed = tracks.filter((track) => track.status === "claimed").length;
        const candidates = tracks.filter((track) => track.status.includes("candidate")).length;
        return [
          metric("Tracks", tracks.length),
          metric("Claimed", claimed),
          metric("Candidates", candidates),
          metric("Product path", data.currentProductPath ?? "—"),
        ];
      }

      function metric(label, value) {
        return `<article class="metric"><span class="muted">${escapeHtml(label)}</span><strong>${escapeHtml(String(value))}</strong></article>`;
      }

      function trackRow(track) {
        return `<tr>
          <td><strong>${escapeHtml(track.name)}</strong><p class="muted">${escapeHtml(track.id)}</p><p>${escapeHtml(track.summary ?? "")}</p></td>
          <td><span class="pill ${escapeHtml(track.status)}">${escapeHtml(track.status)}</span></td>
          <td>${claimBlock(track.currentClaim)}</td>
          <td>${claimBlock(track.nextClaim)}</td>
          <td>${list(track.evidence)}</td>
          <td>${list(track.refusals)}</td>
        </tr>`;
      }

      function claimBlock(claim) {
        if (!claim) return "—";
        return `<ul>${Object.entries(claim)
          .map(
            ([key, value]) =>
              `<li><strong>${escapeHtml(key)}</strong>: ${escapeHtml(String(value))}</li>`,
          )
          .join("")}</ul>`;
      }

      function list(items = []) {
        if (items.length === 0) return "—";
        return `<ul>${items.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ul>`;
      }

      function escapeHtml(value) {
        return value
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }
    </script>
  </body>
</html>
