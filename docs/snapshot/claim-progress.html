<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Machinen claim progress</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f172a;
        --card: #111827;
        --muted: #94a3b8;
        --text: #e5e7eb;
        --line: #334155;
        --good: #22c55e;
        --warn: #f59e0b;
        --info: #38bdf8;
        --bad: #ef4444;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      main {
        max-width: 1180px;
        margin: 0 auto;
        padding: 32px 20px 56px;
      }
      header {
        display: grid;
        gap: 12px;
        margin-bottom: 24px;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: clamp(28px, 5vw, 46px);
        line-height: 1;
      }
      .muted {
        color: var(--muted);
      }
      .toolbar {
        align-items: center;
        border: 1px solid var(--line);
        border-radius: 16px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        padding: 14px;
      }
      button,
      label.file {
        background: #1f2937;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--text);
        cursor: pointer;
        font-weight: 700;
        padding: 9px 14px;
      }
      input[type="file"] {
        display: none;
      }
      .grid {
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        margin: 22px 0;
      }
      .metric,
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 18px;
      }
      .metric strong {
        display: block;
        font-size: 30px;
        margin-top: 6px;
      }
      table {
        border-collapse: collapse;
        margin-top: 18px;
        overflow: hidden;
        width: 100%;
      }
      th,
      td {
        border-bottom: 1px solid var(--line);
        padding: 12px;
        text-align: left;
        vertical-align: top;
      }
      th {
        color: var(--muted);
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .pill {
        border-radius: 999px;
        display: inline-block;
        font-size: 12px;
        font-weight: 800;
        padding: 4px 9px;
        white-space: nowrap;
      }
      .claimed {
        background: color-mix(in srgb, var(--good) 24%, transparent);
        color: #86efac;
      }
      .seed-candidate,
      .product-track-existing {
        background: color-mix(in srgb, var(--warn) 24%, transparent);
        color: #fcd34d;
      }
      .not-started {
        background: color-mix(in srgb, var(--bad) 24%, transparent);
        color: #fca5a5;
      }
      ul {
        margin: 8px 0 0;
        padding-left: 18px;
      }
      code {
        color: #bae6fd;
      }
      .error {
        color: #fecaca;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p class="muted">Machinen product evidence</p>
        <h1>Claim progress dashboard</h1>
        <p class="muted">
          Loads an embedded snapshot automatically. When served over HTTP, Refresh JSON reloads
          <code>claim-progress.json</code> without changing this page.
        </p>
      </header>

      <section class="toolbar">
        <button id="refresh" type="button">Refresh JSON</button>
        <label class="file"
          >Load JSON file<input id="file" type="file" accept="application/json,.json"
        /></label>
        <span id="source" class="muted"></span>
      </section>

      <section id="metrics" class="grid" aria-label="summary metrics"></section>
      <section class="card">
        <h2>Tracks</h2>
        <div id="table"></div>
      </section>
      <p id="error" class="error" role="alert"></p>
    </main>

    <script id="embedded-claim-progress" type="application/json">
      {
        "kind": "machinen.claim-progress-dashboard",
        "version": 1,
        "updatedFrom": [
          "docs/snapshot/node-level5-product-support-claim-registry.json",
          "docs/snapshot/node-level5-product-support-100.json",
          "docs/snapshot/arbitrary-process-level5-seed-matrix.json"
        ],
        "currentProductPath": "machinen snapshot <vm-name> --out <dir>; machinen restore <dir>",
        "tracks": [
          {
            "id": "node-service",
            "name": "Node service restore",
            "status": "claimed",
            "currentClaim": {
              "productSupport": 100,
              "broadSupport": 100,
              "arbitraryProcessCrossArchRestore": 0
            },
            "nextClaim": null,
            "summary": "Selected safe Node services are claimed through the Node service claim ladder. Arbitrary process restore remains outside this track.",
            "evidence": [
              "framework-capability-coverage-v2",
              "framework-combination-corpus",
              "node-runtime-capability-matrix",
              "installed-framework-app-release-gate",
              "broad-node-capability-claim-ready",
              "unified-node-service-claim-gate",
              "cross-corpus-consistency-gate",
              "runtime-state-translation-gate",
              "runtime-framework-combined-claim-ready",
              "final-node-service-ga-gate"
            ],
            "refusals": [
              "arbitrary non-Node processes",
              "raw CPU restore",
              "source ISA emulation",
              "app checkpoint hooks",
              "unsafe live state"
            ],
            "docs": [
              "node-level5-product-support-100.md",
              "node-level5-product-support-next-milestone.md"
            ]
          },
          {
            "id": "arbitrary-process",
            "name": "Arbitrary process cross-architecture restore",
            "status": "seed-candidate",
            "currentClaim": {
              "productSupport": null,
              "broadSupport": null,
              "arbitraryProcessCrossArchRestore": 0
            },
            "nextClaim": {
              "arbitraryProcessCrossArchRestore": 1,
              "claimChangeAllowed": false
            },
            "summary": "Seed matrix exists for tiny target-native reconstruction candidates, including the proven ping socket resource row, but no arbitrary-process claim is raised yet.",
            "evidence": [
              "tiny native idle process seed",
              "argv/env/cwd seed",
              "regular file FD seed",
              "simple pipe FD seed",
              "static/data/heap materialization seed",
              "syscall/resource boundary seed",
              "ping/ICMP socket resource seed"
            ],
            "refusals": [
              "threads",
              "JIT code",
              "futex-owned locks",
              "live sockets",
              "device mmap",
              "active epoll",
              "arbitrary unknown Linux process"
            ],
            "counts": {
              "rows": 14,
              "seedCandidates": 7,
              "refused": 6,
              "notProven": 1
            },
            "docs": ["arbitrary-process-level5-seed-matrix.md", "level4-ping-socket-product.md"]
          },
          {
            "id": "postgres",
            "name": "Postgres portable restore",
            "status": "product-track-existing",
            "currentClaim": {
              "productSupport": null,
              "broadSupport": null,
              "arbitraryProcessCrossArchRestore": 0
            },
            "nextClaim": {
              "productSupport": "to-be-defined",
              "claimChangeAllowed": false
            },
            "summary": "Postgres has an existing clean logical portable product track. It still needs a percent-style claim ladder before it can appear like Node in this dashboard.",
            "evidence": [
              "postgres-clean-quiesced-logical-v1",
              "logical dump integrity",
              "target verifier output"
            ],
            "refusals": [
              "active transactions",
              "active sessions",
              "dirty WAL boundary",
              "ambiguous host-mounted data dir",
              "physical data-dir cross-ISA copy"
            ],
            "docs": ["product-portable-postgres.ts"]
          },
          {
            "id": "bun",
            "name": "Bun service restore",
            "status": "not-started",
            "currentClaim": {
              "productSupport": 0,
              "broadSupport": 0,
              "arbitraryProcessCrossArchRestore": 0
            },
            "nextClaim": {
              "productSupport": "seed-matrix-needed",
              "claimChangeAllowed": false
            },
            "summary": "Bun needs a seed matrix, product-path detector evidence, retained artifacts, and refusal boundaries before any support claim.",
            "evidence": [],
            "refusals": [
              "native/JIT runtime state until proven",
              "active sockets",
              "workers",
              "native addons/plugins",
              "arbitrary Bun apps"
            ],
            "docs": []
          }
        ]
      }
    </script>

    <script>
      const jsonPath = "./claim-progress.json";
      const metrics = document.querySelector("#metrics");
      const table = document.querySelector("#table");
      const source = document.querySelector("#source");
      const error = document.querySelector("#error");

      document.querySelector("#refresh").addEventListener("click", () => loadRemote());
      document.querySelector("#file").addEventListener("change", async (event) => {
        const file = event.target.files?.[0];
        if (!file) return;
        render(JSON.parse(await file.text()), `loaded file: ${file.name}`);
      });

      loadEmbedded();
      if (globalThis.location?.protocol !== "file:") void loadRemote();

      function loadEmbedded() {
        const embedded = document.querySelector("#embedded-claim-progress")?.textContent;
        if (!embedded) return;
        render(JSON.parse(embedded), "embedded claim-progress snapshot");
      }

      async function loadRemote() {
        error.textContent = "";
        try {
          const response = await fetch(`${jsonPath}?t=${Date.now()}`);
          if (!response.ok) throw new Error(`failed to load ${jsonPath}: ${response.status}`);
          render(await response.json(), jsonPath);
        } catch (loadError) {
          error.textContent = `${loadError.message}. Showing the embedded snapshot instead.`;
          loadEmbedded();
        }
      }

      function render(data, label) {
        source.textContent = label;
        const tracks = data.tracks ?? [];
        metrics.innerHTML = metricCards(data, tracks).join("");
        table.innerHTML = `
          <table>
            <thead>
              <tr>
                <th>Track</th>
                <th>Status</th>
                <th>Current claim</th>
                <th>Next claim</th>
                <th>Evidence</th>
                <th>Refusals / boundaries</th>
              </tr>
            </thead>
            <tbody>${tracks.map(trackRow).join("")}</tbody>
          </table>`;
      }

      function metricCards(data, tracks) {
        const claimed = tracks.filter((track) => track.status === "claimed").length;
        const candidates = tracks.filter((track) => track.status.includes("candidate")).length;
        return [
          metric("Tracks", tracks.length),
          metric("Claimed", claimed),
          metric("Candidates", candidates),
          metric("Product path", data.currentProductPath ?? "—"),
        ];
      }

      function metric(label, value) {
        return `<article class="metric"><span class="muted">${escapeHtml(label)}</span><strong>${escapeHtml(String(value))}</strong></article>`;
      }

      function trackRow(track) {
        return `<tr>
          <td><strong>${escapeHtml(track.name)}</strong><p class="muted">${escapeHtml(track.id)}</p><p>${escapeHtml(track.summary ?? "")}</p></td>
          <td><span class="pill ${escapeHtml(track.status)}">${escapeHtml(track.status)}</span></td>
          <td>${claimBlock(track.currentClaim)}</td>
          <td>${claimBlock(track.nextClaim)}</td>
          <td>${list(track.evidence)}</td>
          <td>${list(track.refusals)}</td>
        </tr>`;
      }

      function claimBlock(claim) {
        if (!claim) return "—";
        return `<ul>${Object.entries(claim)
          .map(
            ([key, value]) =>
              `<li><strong>${escapeHtml(key)}</strong>: ${escapeHtml(String(value))}</li>`,
          )
          .join("")}</ul>`;
      }

      function list(items = []) {
        if (items.length === 0) return "—";
        return `<ul>${items.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ul>`;
      }

      function escapeHtml(value) {
        return value
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }
    </script>
  </body>
</html>
