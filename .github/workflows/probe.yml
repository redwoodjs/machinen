name: Probe KVM

# One-off diagnostic: does ubuntu-24.04-arm expose /dev/kvm?
# Temporary — delete once we know the answer.

on:
  push:
    branches: [pp-add-64-mount-paths]

jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Inspect KVM availability
        run: |
          echo "=== uname ==="
          uname -a
          echo
          echo "=== /dev/kvm ==="
          if [[ -c /dev/kvm ]]; then
            ls -la /dev/kvm
            stat /dev/kvm
          else
            echo "NO /dev/kvm device"
          fi
          echo
          echo "=== runner user + groups ==="
          id
          echo
          echo "=== kvm modules ==="
          lsmod | grep -i kvm || echo "no kvm module loaded"
          echo
          echo "=== cpuinfo virt flags ==="
          grep -Eo 'vmx|svm|hypervisor' /proc/cpuinfo | sort -u || true
          echo
          echo "=== kvm-ok (if present) ==="
          command -v kvm-ok && kvm-ok || echo "kvm-ok not installed"
          echo
          echo "=== try opening /dev/kvm ==="
          if [[ -c /dev/kvm ]]; then
            if python3 -c 'import os; os.open("/dev/kvm", os.O_RDWR); print("open() OK")' 2>&1; then
              echo "(readable)"
            else
              echo "(open failed — permission?)"
            fi
          fi
