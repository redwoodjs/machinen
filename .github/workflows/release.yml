name: Release

on:
  push:
    branches: [main]
    paths:
      - ".changeset/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/**"
      - ".github/workflows/release.yml"
      - ".github/workflows/_build-base-assets.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------
  # Local-runner gate. The release workflow does heavy work
  # (cross-platform VMM builds, Linux kernel + Debian rootfs in
  # Docker, npm publish, GH release upload) that only makes sense
  # on real CI — agent-ci's local runner cannot mint npm's trusted
  # publishing OIDC token, the darwin VM checkout fails before it starts,
  # and the docker
  # bind-mounts the rootfs build wants don't round-trip from the
  # nested runner. Emit `skip=true` whenever AGENT_CI_LOCAL is set
  # and gate every other job on it via `needs.gate.outputs.skip`.
  # On real CI the env var is empty and `skip=false` so jobs run as
  # before.
  #
  # Why this shape and not job-level `if: env.AGENT_CI_LOCAL ...`:
  # agent-ci's expression evaluator only resolves `needs.X.outputs.Y`,
  # `success()`/`failure()`, and string literals — `env.X` references
  # fall through as their literal name and the comparison always
  # passes through. Wiring the runner-set env into a real `needs`
  # output is the only thing the evaluator can act on.
  gate:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.detect.outputs.skip }}
    steps:
      - id: detect
        run: |
          if [ "${AGENT_CI_LOCAL:-}" = "true" ]; then
            echo "::warning::AGENT_CI_LOCAL detected — skipping the rest of release.yml. (npm publish, darwin VM, etc. don't apply on a local runner.)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  # ------------------------------------------------------------
  # VMM binaries — built natively per target, uploaded as artifacts
  # for the release job to stage into each vmm-* subpackage.
  # ------------------------------------------------------------
  #
  # darwin job is inlined (rather than `uses: ./_build-vmm-darwin-arm64.yml`)
  # so that agent-ci can statically resolve `runs-on: macos-15`. Through
  # a reusable `uses:` it mis-routes and fails with "executeMacosVmJob
  # called for a other job (labels: [])" before ever evaluating the job.
  build-vmm-darwin-arm64:
    needs: [gate]
    if: needs.gate.outputs.skip != 'true'
    # macos-15: boot_hvf.zig uses the GICv3 API (hv_gic_*) Apple added
    # in macOS 15 / Xcode 16 SDK. macos-14's SDK doesn't export those
    # symbols and the link fails.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Restore cached VMM
        id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            packages/microvm/zig-out/bin/machinen-vm
          key: vmm-darwin-arm64-${{ hashFiles('packages/microvm/src/**', 'packages/microvm/assets/**/*.zig', 'packages/microvm/build.zig', 'packages/microvm/build.zig.zon', 'packages/microvm/entitlements.plist') }}
      - name: Setup Zig
        if: steps.cache.outputs.cache-hit != 'true'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - name: Build VMM
        # macos-15 is arm64 — native build picks up the Hypervisor
        # framework from the system SDK. Passing -Dtarget=aarch64-macos
        # would make Zig treat this as a cross-compile and fail to
        # locate the framework.
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: packages/microvm
        run: zig build -Doptimize=ReleaseSafe
      - name: Ad-hoc codesign with hypervisor entitlement
        # Signature is embedded in the Mach-O, so it survives a cache
        # restore on subsequent runs without needing to re-sign.
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: packages/microvm
        run: |
          codesign -s - --force \
            --entitlements entitlements.plist \
            zig-out/bin/machinen-vm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vmm-arm64-darwin
          path: |
            packages/microvm/zig-out/bin/machinen-vm
          if-no-files-found: error
          retention-days: 7

  build-vmm-arm64-linux:
    needs: [gate]
    if: needs.gate.outputs.skip != 'true'
    # Kept inline — smoke.yml doesn't run the Linux VMM (GitHub runners
    # don't expose KVM), so this job has a single caller today.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - name: Build VMM (linux-arm64, native)
        working-directory: packages/microvm
        run: zig build -Doptimize=ReleaseSafe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vmm-arm64-linux
          path: |
            packages/microvm/zig-out/bin/machinen-vm
          if-no-files-found: error

  build-vmm-x64-linux:
    needs: [gate]
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - name: Build VMM (linux-x64, native)
        working-directory: packages/microvm
        run: zig build -Doptimize=ReleaseSafe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vmm-x64-linux
          path: |
            packages/microvm/zig-out/bin/machinen-vm
          if-no-files-found: error

  # ------------------------------------------------------------
  # Base assets — Linux kernel + dtb + Debian rootfs tarball.
  # Uploaded to the GH Release by the publish job (see below).
  # ------------------------------------------------------------

  build-base-assets:
    needs: [gate]
    if: needs.gate.outputs.skip != 'true'
    uses: ./.github/workflows/_build-base-assets.yml

  # ------------------------------------------------------------
  # Release — Changesets-driven. Opens a "Version Packages" PR on
  # normal merges, publishes to npm + GH Release when that PR merges.
  # ------------------------------------------------------------

  release:
    needs:
      [gate, build-vmm-darwin-arm64, build-vmm-arm64-linux, build-vmm-x64-linux, build-base-assets]
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.4.0
        with:
          version: 10.30.3
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - name: Verify npm trusted publishing support
        run: |
          set -euo pipefail
          npm_version="$(npm --version)"
          echo "npm ${npm_version}"
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) {
              throw new Error(`npm ${process.argv[1]} is too old for trusted publishing; need >= 11.5.1`);
            }
          ' "$npm_version"
      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - run: pnpm install --frozen-lockfile

      # Stage VMM binaries into the consolidated native packages so
      # `changeset publish` picks them up. Each package's `files`
      # field includes `vmm/`.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: vmm-arm64-darwin
          path: packages/native-arm64-darwin/vmm/bin/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: vmm-arm64-linux
          path: packages/native-arm64-linux/vmm/bin/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: vmm-x64-linux
          path: packages/native-x64-linux/vmm/bin/
      # chmod machinen-vm so the working copy stays usable locally; the
      # `bin` field in each package's package.json is what makes pnpm
      # pack preserve the +x bit in the published tarball (issue #309).
      - run: chmod +x packages/native-{arm64-darwin,arm64-linux,x64-linux}/vmm/bin/machinen-vm

      # gvproxy (containers/gvisor-tap-vsock) — bundled next to the VMM
      # so `@machinen/runtime` can auto-spawn it for virtio-net without
      # a separate install step for consumers. Pinned in the shared
      # install script so prod and local dev stay in lockstep.
      - name: Bundle gvproxy
        run: |
          set -euo pipefail
          scripts/install-gvproxy.sh --os darwin --dest packages/native-arm64-darwin/vmm/bin
          scripts/install-gvproxy.sh --os linux  --arch arm64 --dest packages/native-arm64-linux/vmm/bin
          scripts/install-gvproxy.sh --os linux  --arch amd64 --dest packages/native-x64-linux/vmm/bin

      # Stage guest ELFs (init, exec-agent) into each native package's
      # vmm/guest/ dir so they ship in the published tarball. The
      # binaries are guest-arch specific: native-arm64-* carries arm64
      # guest ELFs; native-x64-linux carries amd64 guest ELFs.
      - name: Download arm64 base assets (for guest binaries)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: base-assets-arm64
          path: ${{ runner.temp }}/release-assets-arm64/
      - name: Download amd64 base assets (for guest binaries)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: base-assets-amd64
          path: ${{ runner.temp }}/release-assets-amd64/
      - name: Stage guest binaries into native packages and merge public assets
        run: |
          set -euo pipefail
          arm64_assets="${RUNNER_TEMP}/release-assets-arm64"
          amd64_assets="${RUNNER_TEMP}/release-assets-amd64"

          for pkg in packages/native-arm64-darwin packages/native-arm64-linux; do
            mkdir -p "$pkg/vmm/guest"
            cp "$arm64_assets/init"        "$pkg/vmm/guest/init"
            cp "$arm64_assets/exec-agent"  "$pkg/vmm/guest/exec-agent"
          done
          mkdir -p packages/native-x64-linux/vmm/guest
          cp "$amd64_assets/init"        packages/native-x64-linux/vmm/guest/init
          cp "$amd64_assets/exec-agent"  packages/native-x64-linux/vmm/guest/exec-agent

          rm -rf release-assets
          mkdir -p release-assets
          for src in "$arm64_assets" "$amd64_assets"; do
            find "$src" -maxdepth 1 -type f \
              ! -name init ! -name exec-agent \
              -exec cp {} release-assets/ \;
          done

      # Release-time guard against the regression filed as #309: assert
      # every host-tool tarball pnpm would publish has the right shape —
      # binaries node spawns (machinen-vm, gvproxy, mke2fs, mksquashfs)
      # land in the tarball with +x, and every expected non-exec data
      # file is present too. Runs before the changeset publish so a
      # broken tarball fails the release loudly instead of silently
      # shipping.
      - name: Verify bundled-binary package shape
        run: bash scripts/verify-bin-packages.sh

      # cli typechecks against @machinen/runtime's dist types, so the
      # TS packages need a build before typecheck. Only build the TS
      # packages here; the release VMM binary is downloaded as an
      # artifact above.
      - name: Build TS packages
        run: pnpm -F @machinen/runtime -F @machinen/cli build

      # vitest config lives at the repo root with a workspace-wide
      # include, so tests must run from the root (not per-package).
      # microvm's `zig build test` is covered by tests.yml; it isn't
      # set up on this runner.
      #
      # MACHINEN_REQUIRE_FIXTURES=0 mirrors tests.yml — hosted runners
      # don't have the built microVM fixtures (test-fixtures/init,
      # Image, virt.dtb), so the integration tests that need them
      # skip cleanly rather than ENOENT on first boot().
      - name: Typecheck + test
        env:
          MACHINEN_REQUIRE_FIXTURES: "0"
        run: |
          pnpm -r typecheck
          pnpm exec vitest run

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@63a615b9cd06ba9a3e6d13796c7fbcb080a60a0b # v1.8.0
        with:
          publish: pnpm release
          version: pnpm run version
          title: "chore: version packages"
          commit: "chore: version packages"
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # npm Trusted Publishing mints the npm auth token via GitHub OIDC.
          # Do not set NPM_TOKEN/NODE_AUTH_TOKEN here; setup-node also avoids
          # writing a token-based .npmrc by omitting registry-url above.
          NPM_CONFIG_PROVENANCE: true

      # Only on a real publish: ship the kernel + dtb + rootfs tarball
      # to a Release on this public repo. The CLI's `ensureBaseAssets()`
      # fetches them anonymously from GitHub's release download URLs.
      #
      # The Node script is also the manual release path (`gh auth login`, then
      # run it locally): it rewrites .sha256 sidecars from the exact payload
      # bytes, uploads only the public base assets, and fetches everything back
      # through the public URLs as a release-health gate. This prevents stale
      # sidecars from drifting away from the uploaded payload bytes.
      - name: Publish and verify base assets to redwoodjs/machinen
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACHINEN_RELEASE_VERIFY_TRIES: "6"
          MACHINEN_RELEASE_VERIFY_SLEEP: "10"
        run: node scripts/release-base-assets.mjs publish
