name: Build base assets (reusable)

# Reusable workflow invoked by release.yml. Produces the per-guest-arch
# kernel + optional dtb + Debian rootfs tarball that ships with every
# release and that local smoke jobs need to boot a real guest.
#
# Artifacts:
#   base-assets-arm64:
#     Image-arm64, virt-arm64.dtb, rootfs-debian-arm64.tar.gz,
#     rootfs-debian-arm64.img.gz, *.sha256, guest init/exec-agent
#   base-assets-amd64:
#     bzImage-x86_64, rootfs-debian-amd64.tar.gz,
#     rootfs-debian-amd64.img.gz, *.sha256, guest init/exec-agent
#
# Output is cached on the inputs of build-base-assets.sh + the
# arch-specific kernel builder + the .zig/.dts/.c sources + KVER pin, so
# re-runs on unchanged inputs skip the kernel + Docker builds.

on:
  workflow_call:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - guest-arch: arm64
            runner: ubuntu-24.04-arm
            artifact: base-assets-arm64
            kernel: Image-arm64
            dtb: virt-arm64.dtb
            rootfs: rootfs-debian-arm64.tar.gz
            rootfs-img: rootfs-debian-arm64.img.gz
          - guest-arch: amd64
            runner: ubuntu-latest
            artifact: base-assets-amd64
            kernel: bzImage-x86_64
            dtb: ""
            rootfs: rootfs-debian-amd64.tar.gz
            rootfs-img: rootfs-debian-amd64.img.gz
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # Local agent-ci escape hatch. Two cases short-circuit the build:
      #
      #   1) The developer already has this arch's built kernel + rootfs
      #      in release-assets/. Use those.
      #
      #   2) Running under agent-ci (AGENT_CI_LOCAL=true) without
      #      prebuilt assets. The build calls `docker run -v
      #      $REPO/.build-stage:/stage:ro`, which the *host* docker
      #      daemon resolves against a path that only exists inside
      #      agent-ci's runner container — so /stage mounts as an
      #      empty dir and `install /stage/init` fails. There's no way
      #      to make this work without either bind-mounting the
      #      workspace from host to runner at the same path, or
      #      pre-populating release-assets/. Fail fast with a clear
      #      message instead of letting the build run and ENOENT.
      #
      # Real GitHub runners hit neither branch and the cache+build
      # steps run normally.
      - name: Skip if pre-built base assets are present
        id: prebuilt
        run: |
          set -euo pipefail
          have_dtb=1
          if [ -n "${{ matrix.dtb }}" ] && [ ! -f "release-assets/${{ matrix.dtb }}" ]; then
            have_dtb=0
          fi
          if [ -f "release-assets/${{ matrix.kernel }}" ] \
             && [ "$have_dtb" = "1" ] \
             && [ -f "release-assets/${{ matrix.rootfs }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "release-assets/ already has ${{ matrix.guest-arch }} assets — skipping build."
          elif [ "${AGENT_CI_LOCAL:-}" = "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::AGENT_CI_LOCAL detected without ${{ matrix.guest-arch }} release-assets/ — skipping the docker-based base-assets build (host docker daemon can't see the runner's bind-mount paths). Pre-populate release-assets/ to exercise this workflow locally; on real CI this branch never fires."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore cached base assets
        id: cache
        if: steps.prebuilt.outputs.skip != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: release-assets
          key: base-assets-${{ matrix.guest-arch }}-${{ hashFiles('scripts/build-base-assets.sh', 'scripts/build-kernel-arm64.sh', 'scripts/build-kernel-x86_64.sh', 'packages/microvm/assets/init.zig', 'packages/microvm/assets/exec-agent.zig', 'packages/microvm/assets/machinen-netup.c', 'packages/microvm/assets/machinen-supervisor.sh', 'packages/microvm/assets/virt.dts', 'packages/microvm/patches/kernel/*.patch', 'packages/microvm/patches/criu/*.patch') }}

      - name: Setup Zig
        if: steps.prebuilt.outputs.skip != 'true' && steps.cache.outputs.cache-hit != 'true'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Install build deps
        if: steps.prebuilt.outputs.skip != 'true' && steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            bc bison flex libssl-dev libelf-dev cpio xz-utils \
            curl unzip
          if [ "${{ matrix.guest-arch }}" = "arm64" ]; then
            sudo apt-get install -y --no-install-recommends device-tree-compiler
          fi

      - name: Build base assets
        if: steps.prebuilt.outputs.skip != 'true' && steps.cache.outputs.cache-hit != 'true'
        env:
          MACHINEN_GUEST_ARCH: ${{ matrix.guest-arch }}
        run: ./scripts/build-base-assets.sh

      # Guard the artifact boundary: whether release-assets/ came from a
      # fresh build, a cache restore, or a developer-provided prebuild, every
      # payload must match the sidecar we are about to hand to release.yml.
      # This catches stale-sidecar releases before any public upload.
      - name: Verify base asset checksums
        if: steps.prebuilt.outputs.skip != 'true' || hashFiles(format('release-assets/{0}', matrix.kernel)) != ''
        run: |
          set -euo pipefail
          cd release-assets
          assets=(
            "${{ matrix.kernel }}"
            "${{ matrix.rootfs }}"
            "${{ matrix.rootfs-img }}"
          )
          if [ -n "${{ matrix.dtb }}" ]; then
            assets+=("${{ matrix.dtb }}")
          fi
          for asset in "${assets[@]}"; do
            if [ ! -f "$asset" ]; then
              echo "missing release asset: release-assets/$asset" >&2
              exit 1
            fi
            if [ ! -f "$asset.sha256" ]; then
              echo "missing checksum sidecar: release-assets/$asset.sha256" >&2
              exit 1
            fi
            shasum -a 256 -c "$asset.sha256"
          done

      # Skip the upload when the build was short-circuited and
      # release-assets/ is empty — `if-no-files-found: error` would
      # otherwise fail the job on agent-ci local without prebuilt
      # assets. On real CI the build always populates release-assets/.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.prebuilt.outputs.skip != 'true' || hashFiles(format('release-assets/{0}', matrix.kernel)) != ''
        with:
          name: ${{ matrix.artifact }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 7
