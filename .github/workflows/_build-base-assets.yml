name: Build base assets (reusable)

# Reusable workflow invoked by release.yml and smoke.yml. Produces the
# kernel + dtb + Debian rootfs tarball that ships with every release
# and that the smoke job needs to boot a real guest.
#
# Uploads a single artifact named `base-assets` containing:
#   Image-arm64
#   virt-arm64.dtb
#   rootfs-debian-arm64.tar.gz
#   *.sha256 sidecars
#
# Output is cached on the inputs of scripts/build-base-assets.sh, so
# re-runs on unchanged inputs skip the 5-minute Docker build entirely.

on:
  workflow_call:

jobs:
  build:
    # Native arm64 Linux: Docker pulls linux/arm64 images without QEMU
    # emulation, which turns a ~15-minute mmdebstrap build into ~5.
    runs-on: depot-ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Restore cached base assets
        id: cache
        uses: actions/cache@v4
        with:
          path: release-assets
          key: base-assets-${{ hashFiles('scripts/build-base-assets.sh', 'packages/microvm/assets/init.zig', 'packages/microvm/assets/exec-agent.zig', 'packages/microvm/assets/machinen-netup.c', 'packages/microvm/assets/virt.dts') }}

      - name: Setup Zig
        if: steps.cache.outputs.cache-hit != 'true'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install dtc
        if: steps.cache.outputs.cache-hit != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends device-tree-compiler

      - name: Build base assets
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./scripts/build-base-assets.sh

      - uses: actions/upload-artifact@v4
        with:
          name: base-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: 7
