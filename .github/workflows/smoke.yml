name: Smoke

# End-to-end smoke tests: build the VMM and the base assets, then
# actually boot the guest on an Apple Silicon runner and assert the
# CLI surface behaves as advertised.
#
# The build jobs are reusable workflows shared with release.yml (same
# cache keys, so re-runs on unchanged inputs are cheap). The smoke job
# is the one that requires HVF — only `macos-15` runners have it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vmm:
    uses: ./.github/workflows/_build-vmm-darwin-arm64.yml

  base-assets:
    uses: ./.github/workflows/_build-base-assets.yml

  smoke:
    needs: [vmm, base-assets]
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install runtime prerequisites
        # libslirp: the VMM dylib-links the user-mode network backend;
        #   the build runner has it but the runtime runner needs it too.
        # coreutils: smoke-cli.sh uses gtimeout to cap each guest boot;
        #   BSD coreutils on macOS doesn't ship a `timeout` equivalent.
        run: brew install libslirp coreutils

      - uses: actions/download-artifact@v4
        with:
          name: vmm-arm64-darwin
          path: .smoke/vmm

      - uses: actions/download-artifact@v4
        with:
          name: base-assets
          path: .smoke/assets

      - name: Restore VMM executable bit
        # actions/upload-artifact strips the executable bit on upload;
        # codesign re-run would change the binary hash, so just chmod.
        run: chmod +x .smoke/vmm/microvm

      - name: Build TS packages
        # smoke-cli.sh invokes packages/cli/dist/cli.js directly.
        run: pnpm -F @machinen/runtime -F @machinen/cli build

      - name: Run CLI smoke
        env:
          MACHINEN_VMM: ${{ github.workspace }}/.smoke/vmm/microvm
          MACHINEN_ASSETS_DIR: ${{ github.workspace }}/.smoke/assets
        run: ./scripts/smoke-cli.sh
