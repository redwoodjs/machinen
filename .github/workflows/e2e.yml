name: E2E

on:
  # CRIU checkpoint/restore requires kernel-level access not available on
  # GitHub-hosted runners.  Run locally via: npx agent-ci run -w .github/workflows/e2e.yml
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Clean DinD state
        run: docker rm -f machinen-dind 2>/dev/null || true

      - name: Run e2e test
        run: node packages/machinen/src/__tests__/e2e-local.mjs

      - name: Run session e2e test
        run: node packages/machinen/src/__tests__/e2e-session.mjs

      - name: Cleanup
        if: always()
        run: |
          docker exec machinen-dind docker rm -f registry 2>/dev/null || true
          docker rm -f machinen-dind 2>/dev/null || true
          docker rmi machinen-dind 2>/dev/null || true
