name: Changelog

on:
  pull_request:
    branches: [main]
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled

permissions:
  contents: read
  pull-requests: read

jobs:
  required:
    name: Changeset required
    runs-on: ubuntu-latest
    steps:
      - name: Require a changeset or skip label
        env:
          GH_TOKEN: ${{ github.token }}
          SKIP_LABEL: skip changelog
        run: |
          set -euo pipefail

          if jq -e --arg label "$SKIP_LABEL" 'any(.pull_request.labels[].name; . == $label)' "$GITHUB_EVENT_PATH" >/dev/null; then
            echo "Found '$SKIP_LABEL' label; skipping changeset requirement."
            exit 0
          fi

          pr_number=$(jq -r '.pull_request.number' "$GITHUB_EVENT_PATH")
          files=$(mktemp)
          page=1

          while true; do
            response=$(
              curl --fail --silent --show-error \
                --header "Authorization: Bearer $GH_TOKEN" \
                --header "Accept: application/vnd.github+json" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pulls/${pr_number}/files?per_page=100&page=${page}"
            )

            count=$(jq 'length' <<<"$response")
            jq -r '.[].filename' <<<"$response" >>"$files"

            if [ "$count" -lt 100 ]; then
              break
            fi

            page=$((page + 1))
          done

          if ! grep -E '^packages/(cli|runtime|microvm|mount-server|native-arm64-darwin|native-arm64-linux|native-x64-linux)(/|$)' "$files" >/dev/null; then
            echo "No published Machinen packages changed; skipping changeset requirement."
            exit 0
          fi

          if grep -E '^\.changeset/[^/]+\.md$' "$files" >/dev/null; then
            echo "Found a changeset file."
            exit 0
          fi

          echo "::error::Every PR that changes a published Machinen package must include a .changeset/*.md file. Add the '$SKIP_LABEL' label only when a changelog entry is intentionally not needed."
          echo "Changed files:"
          sed 's/^/- /' "$files"
          exit 1
