name: Release benchmarks

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  schedule:
    # Reconcile missed releases when the benchmark host was offline.
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      versions:
        description: "Optional comma-separated versions; empty reconciles every missing baseline"
        required: false
        type: string
      force:
        description: "Replace existing baselines for the selected versions"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-benchmarks
  cancel-in-progress: false

jobs:
  benchmark:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, macOS, ARM64, machinen-benchmarks]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.4.0
        with:
          version: 10.30.3
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - name: Reconcile release baselines
        env:
          GH_TOKEN: ${{ secrets.MACHINEN_BENCHMARKS_TOKEN }}
          REQUESTED_VERSIONS: ${{ inputs.versions }}
          FORCE_BASELINES: ${{ inputs.force }}
        run: |
          set -euo pipefail
          if [[ "${FORCE_BASELINES:-false}" == "true" ]]; then
            if [[ -n "${REQUESTED_VERSIONS:-}" ]]; then
              scripts/run-release-benchmarks.sh --force "$REQUESTED_VERSIONS"
            else
              scripts/run-release-benchmarks.sh --force
            fi
          elif [[ -n "${REQUESTED_VERSIONS:-}" ]]; then
            scripts/run-release-benchmarks.sh "$REQUESTED_VERSIONS"
          else
            scripts/run-release-benchmarks.sh
          fi
