name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      # node-pty ships prebuilds only for darwin + win32. On the Linux
      # CI runner pnpm falls through to node-gyp rebuild, which needs
      # a C++ toolchain + Python to compile the native binding.
      - name: Install node-pty build deps (Linux)
        run: sudo apt-get update && sudo apt-get install -y build-essential python3

      # packages/microvm builds with Zig. The `pretest` hook runs
      # `pnpm -r build`, which hits microvm's `zig build`. On Linux the
      # HVF-specific code paths are ifdef'd out but the pure-Zig
      # modules (virtio, vsock) still need the toolchain.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - run: pnpm install --frozen-lockfile

      - run: pnpm run format:check

      - run: pnpm run lint

      - run: pnpm typecheck

      # Hosted runners don't have the microVM fixtures (Image, virt.dtb,
      # built boot-test binary). #212 made missing fixtures a hard
      # failure for local dev; opt CI out so the integration cases skip
      # cleanly the way they always have.
      - run: pnpm test
        env:
          MACHINEN_REQUIRE_FIXTURES: "0"
