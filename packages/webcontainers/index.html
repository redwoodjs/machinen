<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebContainers Playground</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: system-ui, -apple-system, sans-serif;
        background: #1a1a2e;
        color: #e0e0e0;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        padding: 12px 16px;
        background: #16213e;
        border-bottom: 1px solid #0f3460;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      header h1 {
        font-size: 14px;
        font-weight: 600;
      }
      #status {
        font-size: 12px;
        color: #888;
      }
      .container {
        flex: 1;
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr;
        gap: 1px;
        background: #0f3460;
        min-height: 0;
      }
      .panel {
        background: #1a1a2e;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .panel-header {
        padding: 8px 12px;
        font-size: 12px;
        font-weight: 600;
        color: #888;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        background: #16213e;
        flex-shrink: 0;
      }
      textarea {
        flex: 1;
        background: #0d1117;
        color: #c9d1d9;
        border: none;
        padding: 12px;
        font-family: "SF Mono", "Fira Code", monospace;
        font-size: 13px;
        resize: none;
        tab-size: 2;
        outline: none;
      }
      #terminal {
        flex: 1;
        min-height: 0;
      }
      iframe {
        flex: 1;
        border: none;
        background: white;
      }
      .btn {
        padding: 4px 10px;
        font-size: 12px;
        background: #0f3460;
        color: #e0e0e0;
        border: 1px solid #1a4a8a;
        border-radius: 4px;
        cursor: pointer;
      }
      .btn:hover {
        background: #1a4a8a;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>WebContainers Playground</h1>
      <span id="status">Booting...</span>
      <button class="btn" id="run-btn" disabled>Run</button>
    </header>
    <div class="container">
      <div class="panel">
        <div class="panel-header">index.js</div>
        <textarea id="editor" spellcheck="false">
import http from "node:http";

const server = http.createServer((req, res) => {
  res.writeHead(200, { "Content-Type": "text/html" });
  res.end(`
    &lt;html&gt;
      &lt;body style="font-family: system-ui; display: grid; place-items: center; height: 100vh; margin: 0;"&gt;
        &lt;h1&gt;Hello from WebContainers!&lt;/h1&gt;
      &lt;/body&gt;
    &lt;/html&gt;
  `);
});

server.listen(3000, () => {
  console.log("Server running on port 3000");
});</textarea
        >
      </div>
      <div class="panel">
        <div class="panel-header">Preview</div>
        <iframe id="preview"></iframe>
      </div>
      <div class="panel" style="grid-column: 1 / -1">
        <div class="panel-header">Terminal</div>
        <div id="terminal"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
